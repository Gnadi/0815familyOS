<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#4F46E5" />
    <!-- title + description + Open Graph/Twitter/canonical are injected per route
         by the <Seo> component (vite-react-ssg <Head>). Keeping them out of this
         template avoids duplicate tags in the pre-rendered HTML. -->

    <!-- PWA: installable web app -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="myFAOS" />
    <meta name="application-name" content="myFAOS" />

    <!-- Self-hosted Inter (see public/fonts). No third-party font request:
         faster, private, works offline, and no render-blocking CDN. Preload the
         body weight so first paint has it; font-display:swap avoids invisible
         text. -->
    <link
      rel="preload"
      href="/fonts/inter-latin-var.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!-- @font-face inlined (kept in sync with public/fonts/inter.css) so the
         font is defined without a render-blocking stylesheet request. -->
    <style>
      @font-face {
        font-family: 'Inter';
        font-style: normal;
        font-weight: 400 800;
        font-display: swap;
        src: url('/fonts/inter-latin-var.woff2') format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6,
          U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122,
          U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
    </style>

    <!-- Preload the above-the-fold hero screenshot (the LCP element) so it
         starts downloading immediately, in its WebP form. -->
    <link rel="preload" as="image" href="/screenshots/dashboard.webp" fetchpriority="high" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
